; Mobile/large-world performance defaults
; Apply these settings in the Godot project when configuring the final build.

[performance]
world_streaming=true
lod_enabled=true
lod_update_interval=0.2
chunk_size_meters=1000

[rendering]
; Prefer mobile-compatible rendering for Android targets.
renderer=mobile

[world]
master_size_km=1200
master_world_area_km2=1440000
