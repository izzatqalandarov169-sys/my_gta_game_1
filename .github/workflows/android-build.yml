name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          test -d "$ANDROID_HOME"
          test -d "$JAVA_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Install SVG to PNG converter
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1080 -h 1920 assets/splash.svg -o assets/splash.png
          file assets/splash.png

      - name: Install Godot editor and Android export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip -d godot
          chmod +x godot/Godot_v4.4.1-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d /tmp/godot-templates
          rm -rf "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          cp -r /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          printf '4.4.1.stable\n' > "$HOME/.local/share/godot/export_templates/4.4.1.stable/version.txt"
          echo '--- Installed Godot export templates ---'
          ls -lah "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_release.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_source.zip"

      - name: Configure Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt
          test -s "$HOME/.android/debug.keystore"

      - name: Configure Godot Android editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = true
          EOF
          cp "$HOME/.config/godot/editor_settings-4.4.tres" "$HOME/.config/godot/editor_settings-4.tres"

      - name: Install Godot Android project build template
        run: |
          rm -rf android
          godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --install-android-build-template
          echo '--- Android project template ---'
          find android -maxdepth 3 -type f -print | sort
          test -f android/build.gradle
          test -f android/settings.gradle
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Validate Godot Android configuration
        run: |
          echo '--- Android environment ---'
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          echo '--- Export preset ---'
          nl -ba export_presets.cfg
          echo '--- Android project template ---'
          find android -maxdepth 2 -type f -print | sort
          echo '--- Godot version ---'
          godot/Godot_v4.4.1-stable_linux.x86_64 --version

      - name: Build APK
        run: |
          mkdir -p build/android
          set +e
          godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-debug "Android" build/android/Uzbek-Legends-Open-World.apk --verbose 2>&1 | tee godot-android-export.log
          status=${PIPESTATUS[0]}
          set -e
          echo "Godot export exit code: $status"
          if [ "$status" -ne 0 ]; then
            echo '--- configuration/error lines ---'
            grep -Ei 'ERROR:|configuration|invalid|missing|Android|SDK|Java|template|keystore|build-tools|apksigner|gradle' godot-android-export.log || true
            exit "$status"
          fi

      - name: Verify APK
        run: |
          test -s build/android/Uzbek-Legends-Open-World.apk
          file build/android/Uzbek-Legends-Open-World.apk
          ls -lh build/android/Uzbek-Legends-Open-World.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Uzbek-Legends-Android-APK
          path: build/android/Uzbek-Legends-Open-World.apk
          if-no-files-found: error
