name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        timeout-minutes: 5
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install SVG converter
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
          test -f assets/splash.svg
          rsvg-convert -w 1080 -h 1920 assets/splash.svg -o assets/splash.png
          file assets/splash.png

      - name: Install Godot 4.4.1 and export templates
        timeout-minutes: 5
        run: |
          wget -q --show-progress https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip -d godot
          chmod +x godot/Godot_v4.4.1-stable_linux.x86_64
          wget -q --show-progress https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          rm -rf /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          printf '4.4.1.stable\n' > "$HOME/.local/share/godot/export_templates/4.4.1.stable/version.txt"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_source.zip"

      - name: Configure debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          test -s "$HOME/.android/debug.keystore"

      - name: Configure Godot Android settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Install Godot Android project template
        timeout-minutes: 5
        run: |
          rm -rf android
          godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --install-android-build-template
          test -f android/build.gradle
          test -f android/settings.gradle
          test -x android/gradlew || chmod +x android/gradlew
          test -f android/gradlew

      - name: Validate project before export
        timeout-minutes: 3
        run: |
          godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --quit-after 3 2>&1 | tee godot-project-check.log
          status=${PIPESTATUS[0]}
          echo "Godot project check exit code: $status"
          if [ "$status" -ne 0 ]; then
            grep -Ei 'ERROR:|SCRIPT ERROR|Parse Error|Invalid|missing|Android|SDK|Java|template' godot-project-check.log || true
            exit "$status"
          fi

      - name: Build APK
        timeout-minutes: 8
        run: |
          mkdir -p build/android
          set +e
          timeout --signal=TERM 420s godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-debug "Android" build/android/Uzbek-Legends-Open-World.apk --verbose 2>&1 | tee godot-android-export.log
          status=${PIPESTATUS[0]}
          set -e
          echo "Godot export exit code: $status"
          if [ "$status" -ne 0 ]; then
            echo '--- REAL ERROR LINES ---'
            grep -Ei 'ERROR:|SCRIPT ERROR|Parse Error|Cannot export|configuration errors|missing|invalid|Android build template|SDK|Java|keystore|Gradle|apksigner' godot-android-export.log | tail -80 || true
            exit "$status"
          fi

      - name: Verify APK
        run: |
          test -s build/android/Uzbek-Legends-Open-World.apk
          file build/android/Uzbek-Legends-Open-World.apk
          ls -lh build/android/Uzbek-Legends-Open-World.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Uzbek-Legends-Android-APK
          path: build/android/Uzbek-Legends-Open-World.apk
          if-no-files-found: error
