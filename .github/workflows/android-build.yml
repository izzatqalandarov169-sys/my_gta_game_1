name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install SVG to PNG converter
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Prepare PNG splash
        run: |
          mkdir -p assets
          rsvg-convert -w 1080 -h 1920 assets/splash.svg -o assets/splash.png
          file assets/splash.png

      - name: Install Godot editor and Android export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip -d godot
          chmod +x godot/Godot_v4.4.1-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Configure Godot Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

      - name: Build APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/godot-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cp "$HOME/.android/debug.keystore" "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          mkdir -p build/android
          godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-debug "Android" build/android/Uzbek-Legends-Open-World.apk --verbose

      - name: Verify APK
        run: |
          test -s build/android/Uzbek-Legends-Open-World.apk
          file build/android/Uzbek-Legends-Open-World.apk
          ls -lh build/android/Uzbek-Legends-Open-World.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Uzbek-Legends-Android-APK
          path: build/android/Uzbek-Legends-Open-World.apk
          if-no-files-found: error
